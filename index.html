    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var redirect = sessionStorage.getItem('portfolio:redirect');
          if (redirect) {
            sessionStorage.removeItem('portfolio:redirect');
            if (redirect !== location.href) history.replaceState(null, '', redirect);
          }
        } catch (e) {}
        // /Portfolio/en/ e /Portfolio/es/ existem para a prévia de link: abrem o site no idioma e voltam à raiz.
        var pathLang = (location.pathname.match(/^\/Portfolio\/(en|es)\/?(?:index\.html)?$/i) || [])[1];
        if (pathLang) {
          pathLang = pathLang.toLowerCase();
          try { localStorage.setItem('selectedLanguage', pathLang); } catch (e) {}
          history.replaceState(null, '', '/Portfolio/' + location.search + location.hash);
        }
        var saved = null;
        try { saved = localStorage.getItem('selectedLanguage'); } catch (e) {}
        var lang = saved;
        if (lang !== 'pt' && lang !== 'en' && lang !== 'es') {
          var navLang = (navigator.language || '').toLowerCase();
          lang = navLang.indexOf('pt') === 0 ? 'pt' : navLang.indexOf('es') === 0 ? 'es' : 'en';
        }
        document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
        document.documentElement.classList.add('js');
      })();
    </script>
