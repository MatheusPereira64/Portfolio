name: CI

on:
  push:
    branches: [main, development]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_PLAUSIBLE_DOMAIN: ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}

      # Teste rápido no build: página, idiomas, modais, formulário e chatbot sob demanda.
      - run: npx playwright install --with-deps chromium

      - name: Teste rápido
        run: |
          set -o pipefail
          node --test tests/smoke.test.mjs 2>&1 | tee smoke-output.txt

      # Os logs do Actions pedem login; as anotações não. Publica as linhas da falha como anotação.
      - name: Resumo da falha
        if: failure()
        run: grep -E 'not ok|Error|error|último valor|expected|actual|erros no console' smoke-output.txt | head -30 | sed 's/^/::error::/'
